<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios JavaScript - Aula 2 (CEUB)</title>
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Exercícios de JavaScript - Aula 2</h1>

        <section>
            <h2>1. Verificador de Idade</h2>
            <label for="idade">Informe sua idade: </label>
            <input id="idade" type="number" min="0" max="120" step="1">
            <button id="verificar" type="button">Verificar</button>
            <p id="resultado" role="status" aria-live="polite"></p>
        </section>

        <hr>

        <section>
            <h2>2. Calculadora de Média</h2>
            <div>
                <label for="n1">Nota 1: </label>
                <input id="n1" type="number" min="0" max="10" step="0.1">
            </div>
            <div>
                <label for="n2">Nota 2: </label>
                <input id="n2" type="number" min="0" max="10" step="0.1">
            </div>
            <div>
                <label for="n3">Nota 3: </label>
                <input id="n3" type="number" min="0" max="10" step="0.1">
            </div>
            <button id="calcular" type="button">Calcular Média</button>
            <p id="resultadoMedia" role="status" aria-live="polite"></p>
        </section>

        <hr>

        <section>
            <h2>3. Saudação</h2>
            <label for="nome">Digite seu nome: </label>
            <input id="nome" type="text">
            <button id="btnSaudar" type="button">Saudar</button>
            <p id="mensagemSaudacao" role="status" aria-live="polite"></p>
        </section>

        <hr>

        <section>
            <h2>4. Classificação de Temperatura</h2>
            <label for="temp">Temperatura (°C): </label>
            <input id="temp" type="number" step="0.1">
            <button id="btnVerificarTemp" type="button">Verificar</button>
            <p id="resultadoTemp" role="status" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
