<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Aula 3 - Aplicação Web Completa</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .campo { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #004494; }
        #mensagem { margin-top: 20px; padding: 12px; border-radius: 4px; display: none; font-weight: bold; }
        .erro { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .sucesso { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alerta { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    </style>
</head>
<body>
    <h2>Boletim Escolar</h2>
    
    <form id="formBoletim">
        <div class="campo">
            <label for="nome">Nome do Aluno:</label>
            <input type="text" id="nome" placeholder="Ex: João Silva">
        </div>
        <div class="campo">
            <label for="nota1">Nota 1:</label>
            <input type="number" id="nota1" step="0.1" placeholder="0 a 10">
        </div>
        <div class="campo">
            <label for="nota2">Nota 2:</label>
            <input type="number" id="nota2" step="0.1" placeholder="0 a 10">
        </div>
        <button type="submit">Calcular Resultado</button>
    </form>

    <div id="mensagem"></div>

    <script src="script.js"></script>
</body>
</html>
